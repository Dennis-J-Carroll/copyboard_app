[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "copyboard-extension"
version = "0.5.0"
description = "A ten-chamber clipboard revolver for desktop workflows"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
  {name = "Dennis J. Carroll"},
]
dependencies = [
  "pyperclip>=1.8.0",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Desktop Environment",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/Dennis-J-Carroll/copyboard_app"
Repository = "https://github.com/Dennis-J-Carroll/copyboard_app"
Issues = "https://github.com/Dennis-J-Carroll/copyboard_app/issues"
Releases = "https://github.com/Dennis-J-Carroll/copyboard_app/releases"

[project.optional-dependencies]
hotkeys = ["keyboard>=0.13.5"]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "pytest-timeout>=2.0",
  "pytest-mock>=3.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
copyboard = "copyboard_extension.cli:main"
copyboard-gui = "copyboard_extension.copyboard_gui:main"
copyboard-install-integration = "copyboard_extension.system_integration:install_context_menu_integration"

[tool.setuptools.packages.find]
include = ["copyboard_extension*"]

[tool.setuptools.package-data]
copyboard_extension = [
  "assets/*.png",
  "snippets/*.json",
  "browser_extension/*.html",
  "browser_extension/*.js",
  "browser_extension/*.json",
  "browser_extension/icons/*.png",
]
